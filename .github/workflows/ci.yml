name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and optional HTTP transport
        run: python -m pip install -e ".[http]"
      - name: Behavior regression suite
        run: python -m unittest discover -s tests -v
      - name: Installed CLI smoke with urllib
        run: python examples/smoke.py --cli forge
      - name: Installed CLI smoke with curl
        run: python examples/smoke.py --transport curl_cffi --cli forge

  package:
    name: Wheel and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Installed version
        run: forge --version
      - name: Exercise installed wheel against local fixture
        run: python examples/smoke.py --cli forge
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
